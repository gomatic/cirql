# Quality budget — set BEFORE implementation. Planner, architect, implementer,
# and reviewer all optimize against these constraints.
#
# cirql is a production-bound library in the gomatic Go ecosystem, so the budget
# is the full Go quality bar, not the SDD default: 100% coverage, gocognit <= 7,
# constant errors, DI. See the org Go Code Quality Standards.
tier: production
max_cognitive_complexity: 7                  # gocognit -over 7 must be empty (production files)
max_function_length: 50
max_dependencies_per_package: 8
minimum_test_coverage: 100                    # owned packages; src/grammar (generated) excluded
required_error_handling: exhaustive           # constant sentinels; failure paths asserted with errors.Is
required_observability: structured_logs

# Mechanical gates (the `make check` superset must pass; see the shared Makefile).
gates:
  format: gofumpt -l . prints nothing
  vet: go vet ./... clean
  static: staticcheck ./... clean
  vuln: govulncheck ./... clean
  complexity: gocognit -over 7 (non-_test.go) empty
  coverage: go test total == 100.0% over COVER_PKGS (excludes /src/grammar)
  release: goreleaser check valid
  grammar: parser is ANTLR4 .g4 -> committed src/grammar (never hand-rolled); wrapper 100% covered

# Scoring weights (sum to 100). The quality-architect scores against these.
weights:
  correctness: 35
  maintainability: 20
  testability: 15
  reliability: 15
  simplicity: 10
  security: 5
